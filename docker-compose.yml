version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: flashseat_db
    environment:
      POSTGRES_USER: flashseat
      POSTGRES_PASSWORD: flashseat
      POSTGRES_DB: flashseat
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flashseat -d flashseat"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: flashseat_redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  redisdata:
